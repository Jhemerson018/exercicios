<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixa </title>
    <style>
        h1{
            background-color: lightgray;
            height: 300px;
            width: 300px;
        
            border: 5px solid darkslategray ;
            border-radius: 20px;
        
            padding: 10px;

            margin: 10px;

            outline: 5px salmon dotted;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Paágrafos também são exemplos de box-level, mas os <a href="#">Links</a> são exemplos de caixas inline-level. Vamos ver como isso funciona!</p>
</body>
</html>
