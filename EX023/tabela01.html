<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border: 1px solid black;
            border-radius: 3px;
            width: 400px;
            height: 400px;
            background-color: blue;
        }

        td{
            border: 1px solid black;
            border-radius: 3px;
            padding: 8px;
            background-color: black;
            color: white;
            text-align: center;/*Alinhamento horizontal(right, center or left)*/
            vertical-align: top;/*Alinhamento vertical (top, middle or bottom)*/
        }
    </style>
    <title>Tabelas</title>
</head>
<body>
    <h1>Minha Primeira Tabela</h1>
    <!--HIERARQUIA DE TABELAS SIMPLES
    TABLE = TABELA
        TABLE ROW = LINHAS DE TABELA
            TABLE HEADER = CABEÇALHO DE TABELA
            TABLE DATA = DADOS DE TABELA
    -->
    <table>
        <tr><!--Primeira linha-->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr><!--Segunda linha-->
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr><!--Terceira linha-->
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr><!--Quarta linha-->
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
