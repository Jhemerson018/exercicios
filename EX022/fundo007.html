<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento Vertical</title>
    <style>
        #container{
            position: relative;
            height: 90vh;
            padding: 10px;
            background-color: purple;
        }
        #conteudo{
            position: absolute;
            height: 200px;
            width: 400px;
            left: 50%;
            top: 50%;
            background-color: yellow;
            transform: translate(-50%, -50%); /*essa alteração consegue definir manualmente a posição do elemento, na horizontal (sendo valores positivos para direita e valores negativos para a direita) quanto na vertical (com números negativos para cima e números positivos para baixo) */

        }
    </style>
</head>
<body>
    <section id ="container">
        <article id ="conteudo">

        </article>
    </section>
</body>
</html>
